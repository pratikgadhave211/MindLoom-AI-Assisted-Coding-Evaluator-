[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langchain==1.2.12", "langgraph==1.1.2", "langchain-openrouter==0.2.8", "langchain-groq==1.1.3", "langchain-nvidia-ai-endpoints==1.4.2", "openrouter==0.11.46", "httpx==0.28.1", "python-dotenv==1.2.2", "langsmith==0.6.9", "langgraph-checkpoint-postgres==3.1.0", "psycopg[binary]==3.3.4", "fastapi==0.141.1", "uvicorn==0.49.0", "docker==7.2.0", "tokenizers==0.22.2", "huggingface-hub==0.36.2", "gliner==0.2.30", "presidio-analyzer==2.2.366", "presidio-anonymizer==2.2.366", "spacy==3.8.18", "cryptography==50.0.2", "nemoguardrails==0.23.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
coding-agent = "coding_agent.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
